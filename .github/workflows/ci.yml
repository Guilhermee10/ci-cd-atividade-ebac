name: CI - Testes Cypress
 
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
 
jobs:
  testes:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
 
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
 
      - name: Instalar dependências
        run: npm install
 
      - name: Rodar testes Cypress
        run: npx cypress run --env allure=true
 
      - name: Gerar relatório Allure
        if: always()
        run: npx allure@3.9.0 generate --output allure-report allure-results
 
      - name: Publicar relatório Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
 